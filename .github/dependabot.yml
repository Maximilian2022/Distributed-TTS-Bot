# GitHub Dependabot Configuration
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Python 依存関係 (pip: requirements.txt, requirements-optional.txt)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "build(deps):"
      include: "scope"
    labels:
      - "dependencies"
      - "python"
    reviewers:
      - "Maximilian2022"

  # GitHub Actions ワークフロー (.github/workflows/)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps):"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
    reviewers:
      - "Maximilian2022"

  # Docker コンテナベースイメージ (Dockerfile)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps):"
      include: "scope"
    labels:
      - "dependencies"
      - "docker"
    reviewers:
      - "Maximilian2022"
