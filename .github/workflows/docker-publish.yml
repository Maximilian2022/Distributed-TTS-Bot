name: Build, Push Docker Image & Create Release

on:
  push:
    branches:
      - main
    tags:
      - 'Distributed-TTS-Bot-v*.*.*'
      - 'v*.*.*'
    paths-ignore:
      - 'docs/**'
      - 'logs/**'
      - 'scratch/**'
      - '.agents/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  docker-build-push-release:
    name: Build, Push to Docker Hub & Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine Version Tag
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG_NAME="${{ github.ref_name }}"
          else
            # main push または workflow_dispatch の場合: 日付 + 実行番号 (例: Distributed-TTS-Bot-v2026.10.24.1)
            DATE=$(date +'%Y.%m.%d')
            TAG_NAME="Distributed-TTS-Bot-v${DATE}.${{ github.run_number }}"
          fi
          echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "Determined release tag: ${TAG_NAME}"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Python Syntax Check & Unit Tests
        run: |
          python -m py_compile src/*.py src/**/*.py scripts/*.py worker/*.py tests/*.py
          pip install -r requirements.txt
          python -m unittest discover tests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: madpiero/ttsbot
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ steps.version.outputs.tag }}
            type=sha,format=short,prefix=sha-

      - name: Build and Push Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prepare Japanese Release Notes
        id: release_notes
        run: |
          if [ -s RELEASE_NOTES.md ]; then
            echo "✓ Using RELEASE_NOTES.md"
            cp RELEASE_NOTES.md release_body.md
          else
            echo "ℹ️ RELEASE_NOTES.md not found or empty. Extracting latest entry from logs/remediation_history.md"
            python3 -c "
            import re
            body = ''
            try:
                with open('logs/remediation_history.md', 'r', encoding='utf-8') as f:
                    content = f.read()
                entries = re.split(r'\n(?=## \[)', content)
                if len(entries) > 1:
                    body = entries[1].strip()
            except Exception as e:
                print(f'Error reading remediation history: {e}')

            if not body:
                body = '## 🚀 アップデート\n詳細な変更内容はコミット履歴をご確認ください。'

            with open('release_body.md', 'w', encoding='utf-8') as out:
                out.write(body + '\n')
            "
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Distributed-TTS-Bot ${{ steps.version.outputs.tag }}"
          body_path: release_body.md
          generate_release_notes: false
          draft: false
          prerelease: false
          files: |
            docker-compose.yml
            docker-compose.slave.yml
            portainer-stack.yml
            src/web/static/setup-standby.sh
            src/web/static/setup-standby.ps1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
