bot:
  command_prefix: "!"
  # 自動参加対象のボイスチャンネルID (0の場合は無効)
  auto_join_vc_id: 0
  # 自動参加時に紐付けるテキストチャンネルID (0の場合は無効)
  auto_join_text_channel_id: 0
  # 読み上げ最大文字数 (超過部分は切り捨てて「以下略」を付与)
  max_text_length: 50
  # 重複抑制の閾値秒数 (この秒数以内の同一短文はスキップ)
  dedup_window_seconds: 5.0
  # 重複抑制の最大文字数
  dedup_max_length: 10
  # 読み上げを行わないプレフィックス文字リスト (デフォルト: セミコロン「;」「；」)
  ignore_prefixes:
    - ";"
    - "；"

storage:
  cache_dir: "/app/cache"
  db_path: "/app/data/bot.db"
  log_file: "/app/logs/bot.log"
  # クラウドキャッシュ上限サイズ (10GB = 10 * 1024 * 1024 * 1024)
  cache_max_size_bytes: 10737418240
  # クリーンアップ後の目標容量 (8.5GB = 8.5 * 1024 * 1024 * 1024)
  cache_target_size_bytes: 9126805504
  # VOICEVOX専用キャッシュ設定 (20GB Volume)
  voicevox_cache_dir: "/app/cache_voicevox"
  voicevox_cache_max_size_bytes: 21474836480 # 20GB
  voicevox_cache_target_size_bytes: 18253611008 # 17GB
  # 定期クリーンアップ間隔 (秒)
  cache_cleanup_interval_seconds: 300

tts:
  primary: "azure"
  fallback: "google"
  google_monthly_limit_chars: 950000 # 無料枠(100万文字)の95%で自動フォールバック
  azure:
    region: "japaneast"
    timeout_seconds: 5.0
  google:
    # 東京リージョンエンドポイント
    endpoint: "asia-northeast1-texttospeech.googleapis.com"
    timeout_seconds: 5.0
  voicevox:
    base_url: "http://127.0.0.1:50021"
    timeout_seconds: 10.0
    default_fallback_style_id: 3 # ずんだもん (ノーマル)
    nodes:
      - id: "local_master"
        url: "http://127.0.0.1:50021"
        priority: 2          # 優先度 (1=GPU, 2=通常CPU, 3=予備)
        max_concurrent: 1    # 同時実行上限
        enabled: false       # 完全Worker分離に伴い、Worker Agent から動的登録されるため初期値は無効
      - id: "worker_node_1"
        url: "http://192.168.1.100:50021" # 外部WorkerサーバーのIPとポート例
        priority: 2
        max_concurrent: 1
        enabled: false       # Worker Agent から動的登録されるため初期値は無効
      - id: "gpu_worker_1"
        url: "http://192.168.1.200:50021" # GPU Worker PC のIPとポート例
        priority: 1          # GPU最優先
        max_concurrent: 2
        enabled: false       # Worker Agent から動的登録されるため初期値は無効
  sharevox:
    base_url: "http://127.0.0.1:50025"
    timeout_seconds: 10.0
    nodes:
      - id: "local_master"
        url: "http://127.0.0.1:50025"
        priority: 2
        max_concurrent: 1
        enabled: false       # Worker Agent から動的登録されるため初期値は無効
      - id: "worker_node_1"
        url: "http://192.168.1.100:50025"
        priority: 2
        max_concurrent: 1
        enabled: false
  coeiroink:
    base_url: "http://127.0.0.1:50031"
    timeout_seconds: 25.0
    nodes:
      - id: "local_master"
        url: "http://127.0.0.1:50031"
        priority: 2
        max_concurrent: 1
        enabled: false       # Worker Agent から動的登録されるため初期値は無効
      - id: "worker_node_1"
        url: "http://192.168.1.100:50031"
        priority: 2
        max_concurrent: 1
        enabled: false
      - id: "gpu_worker_1"
        url: "http://192.168.1.200:50031"
        priority: 1
        max_concurrent: 2
        enabled: false
  openjtalk:
    voices_dir: "/app/openjtalk_voices"
    dic_dir: "/var/lib/mecab/dic/open-jtalk/naist-jdic"
    timeout_seconds: 5.0


