x-bot-base: &bot-base
  build:
    context: .
    dockerfile: Dockerfile
  init: true
  deploy:
    resources:
      limits:
        cpus: '2.0'
        memory: 2048M
      reservations:
        memory: 512M
  healthcheck:
    test: ["CMD-SHELL", "python -c 'import os, sys, urllib.request; sys.exit(0 if os.path.exists(\"/tmp/ttsbot_ready\") or (lambda: urllib.request.urlopen(\"http://127.0.0.1:8080/health\", timeout=3).status == 200)() else 1)' 2>/dev/null || exit 1"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 30s
  volumes:
    - tts_cache:/app/cache
    - voicevox_cache:/app/cache_voicevox
    - coeiroink_models:/app/coeiroink_models:ro
    - bot_data:/app/data
    - ./src:/app/src
    - ./logs:/app/logs
    - ./config.yaml:/app/config.yaml
    - ./gcp-key.json:/app/gcp-key.json:ro
    - ./openjtalk_voices:/app/openjtalk_voices:ro
    - /var/run/docker.sock:/var/run/docker.sock
  env_file:
    - .env
  environment:
    - PYTHONUNBUFFERED=1
    - PYTHONPATH=/app
    - TZ=Asia/Tokyo
    - COEIROINK_MODEL_DIR=/app/coeiroink_models
    - TTSBOT_STANDBY=${TTSBOT_STANDBY:-0}
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

services:
  router:
    image: nginx:alpine
    container_name: ttsbot-router
    restart: unless-stopped
    ports:
      - "8088:8080"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    networks:
      default:
        aliases:
          - ttsbot

  ttsbot-blue:
    <<: *bot-base
    container_name: ttsbot-blue
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - TZ=Asia/Tokyo
      - COEIROINK_MODEL_DIR=/app/coeiroink_models
      - TTSBOT_STANDBY=${TTSBOT_STANDBY:-0}
      - TTSBOT_NODE=${TTSBOT_NODE:-ubuntu}
      - TTSBOT_SLOT=blue

  ttsbot-green:
    <<: *bot-base
    container_name: ttsbot-green
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - TZ=Asia/Tokyo
      - COEIROINK_MODEL_DIR=/app/coeiroink_models
      - TTSBOT_STANDBY=${TTSBOT_STANDBY:-0}
      - TTSBOT_NODE=${TTSBOT_NODE:-ubuntu}
      - TTSBOT_SLOT=green

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: ttsbot-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - router
    healthcheck:
      test: ["CMD", "cloudflared", "--version"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  tts_cache:
    name: tts_cache
  voicevox_cache:
    name: voicevox_cache
  bot_data:
    name: bot_data
  coeiroink_models:
    name: coeiroink_models
