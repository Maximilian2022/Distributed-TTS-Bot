# ==============================================================================
# TTSBot OSS Docker Compose 設定ファイル
#
# クイックスタート (スタンドアロン):
#   docker compose up -d
#
# オプション機能付き起動:
#   - ローカル VOICEVOX エンジン同梱: docker compose --profile voicevox up -d
#   - Cloudflare Tunnel 同梱:      docker compose --profile tunnel up -d
#   - 全て同梱:                    docker compose --profile voicevox --profile tunnel up -d
# ==============================================================================

x-bot-base: &bot-base
  build:
    context: .
    dockerfile: Dockerfile
  init: true
  deploy:
    resources:
      limits:
        cpus: '2.0'
        memory: 2048M
      reservations:
        memory: 512M
  healthcheck:
    test: ["CMD-SHELL", "python -c 'import urllib.request, os, sys; p = os.getenv(\"WEB_PORT\", \"8080\"); sys.exit(0 if urllib.request.urlopen(f\"http://127.0.0.1:{p}/health\", timeout=3).status == 200 else 1)' 2>/dev/null || exit 1"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 30s
  volumes:
    - ./src:/app/src
    - ./data:/app/data
    - ./logs:/app/logs
    - tts_cache:/app/cache
    - voicevox_cache:/app/cache_voicevox
    - coeiroink_models:/app/coeiroink_models
    - ./openjtalk_voices:/app/openjtalk_voices:ro
    - ./gcp-key.json:/app/gcp-key.json:ro
    - /var/run/docker.sock:/var/run/docker.sock
  env_file:
    - .env
  environment:
    - PYTHONUNBUFFERED=1
    - PYTHONPATH=/app
    - TZ=Asia/Tokyo
    - COEIROINK_MODEL_DIR=/app/coeiroink_models
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

services:
  # ----------------------------------------------------------------------------
  # 1. メインアプリケーション (デフォルト: スタンドアロン起動)
  # ----------------------------------------------------------------------------
  app:
    <<: *bot-base
    restart: unless-stopped
    ports:
      - "${HOST_WEB_PORT:-8088}:${WEB_PORT:-8080}"
    networks:
      default:
        aliases:
          - router
          - ttsbot
          - ttsbot-router

  # ----------------------------------------------------------------------------
  # 2. ローカル VOICEVOX エンジン (オプション: --profile voicevox)
  # ----------------------------------------------------------------------------
  voicevox:
    image: voicevox/voicevox_engine:cpu-ubuntu20.04-latest
    restart: unless-stopped
    profiles:
      - voicevox
    ports:
      - "50021:50021"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  # ----------------------------------------------------------------------------
  # 3. Cloudflare Tunnel (オプション: --profile tunnel)
  # ----------------------------------------------------------------------------
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles:
      - tunnel
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - app
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

volumes:
  tts_cache:
  voicevox_cache:
  coeiroink_models:
